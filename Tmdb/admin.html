<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Movie Admin Panel</title>

<style>
body{
  background:#0a0a0a;
  color:#fff;
  font-family:Arial;
  margin:0;
  padding:20px;
}
input,button{
  padding:10px;
  border:none;
  border-radius:6px;
}
button{
  background:#01b4e4;
  font-weight:bold;
  cursor:pointer;
}
.list{
  margin-top:20px;
}
.item{
  background:#161616;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  border-radius:6px;
}
a{ color:#01b4e4; text-decoration:none; }
</style>
</head>

<body>

<h2>Admin Panel</h2>

<input id="movieId" placeholder="TMDB Movie ID daalo">
<button onclick="saveMovie()">Save</button>

<div class="list" id="list"></div>

<script>
const API_KEY = "7bffed716d50c95ed1c4790cfab4866a";

let movies = JSON.parse(localStorage.getItem("movies")) || [];
render();

function saveMovie(){
  const id = document.getElementById("movieId").value;
  if(!id) return alert("ID daalo");
  if(movies.includes(id)) return alert("Pehle se hai");

  movies.push(id);
  localStorage.setItem("movies", JSON.stringify(movies));
  document.getElementById("movieId").value="";
  render();
}

function removeMovie(id){
  movies = movies.filter(m=>m!==id);
  localStorage.setItem("movies", JSON.stringify(movies));
  render();
}

function render(){
  const box = document.getElementById("list");
  box.innerHTML="";
  movies.forEach(id=>{
    box.innerHTML += `
      <div class="item">
        <span>Movie ID: ${id}</span>
        <span>
          <a href="movie.html?id=${id}" target="_blank">Open</a>
          |
          <a href="#" onclick="removeMovie('${id}')">Delete</a>
        </span>
      </div>
    `;
  });
}
</script>

</body>
</html>
