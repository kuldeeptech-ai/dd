<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Movie</title>
<style>
body{ margin:0;background:#000;color:#fff;font-family:Arial }
.banner{ height:60vh;background-size:cover;display:flex;align-items:end;padding:20px }
.poster img{ width:160px;border-radius:10px }
.cast{ display:flex;gap:10px;flex-wrap:wrap }
.cast img{ width:70px;height:70px;border-radius:50% }
</style>
</head>

<body>

<div class="banner" id="banner">
  <div class="poster">
    <img id="poster">
  </div>
</div>

<h2 id="title"></h2>
<div class="cast" id="cast"></div>
<script>
const API="7bffed716d50c95ed1c4790cfab4866a";
const p = new URLSearchParams(location.search);
const id = p.get("id");
const name = p.get("name");

let movies = JSON.parse(localStorage.getItem("movies")) || [];
let movieId = id;

if(name){
 const f = movies.find(x=>x.slug===name);
 if(f) movieId = f.id;
}

fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API}`)
.then(r=>r.json())
.then(m=>{
 document.title = m.title;
});
</script>
<script>
const API_KEY="7bffed716d50c95ed1c4790cfab4866a";
const id = new URLSearchParams(location.search).get("id");

fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}`)
.then(r=>r.json())
.then(m=>{
  banner.style.backgroundImage =
   `url(https://image.tmdb.org/t/p/original${m.backdrop_path})`;
  poster.src =
   `https://image.tmdb.org/t/p/w500${m.poster_path}`;
  title.innerText = m.title;
});

fetch(`https://api.themoviedb.org/3/movie/${id}/credits?api_key=${API_KEY}`)
.then(r=>r.json())
.then(c=>{
  c.cast.slice(0,10).forEach(x=>{
    if(!x.profile_path) return;
    cast.innerHTML +=
     `<img src="https://image.tmdb.org/t/p/w200${x.profile_path}">`;
  });
});
</script>

</body>
</html>
