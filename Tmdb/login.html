<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body{
 background:#000;
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
 font-family:Arial;
}
.box{
 background:#111;
 padding:25px;
 border-radius:10px;
}
input,button{
 width:100%;
 margin-top:10px;
 padding:10px;
}
button{
 background:#01b4e4;
 border:none;
 font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h3>Admin Login</h3>
<input id="user" placeholder="1234">
<input id="pass" type="password" placeholder="123">
<button onclick="login()">Login</button>
</div>

<script>
function login(){
 if(user.value==="admin" && pass.value==="12345"){
  localStorage.setItem("login","yes");
  location.href="admin.html";
 }else{
  alert("Galat chabi");
 }
}
</script>

</body>
</html>
