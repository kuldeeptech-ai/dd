<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Movie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--accent:#01b4e4}
body{margin:0;background:#050505;color:#fff;font-family:Arial}
.wrapper{max-width:1100px;margin:auto;padding:15px}

/* BANNER */
.banner{
 position:relative;
 height:60vh;
 background-size:cover;
 background-position:center;
 border-radius:16px;
 overflow:hidden;
}
.banner::before{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(
  to right,
  rgba(0,0,0,.85),
  rgba(0,0,0,.3)
 );
}
.banner-content{
 position:relative;
 display:flex;
 align-items:flex-end;
 gap:18px;
 padding:20px;
 height:100%;
}
.poster img{
 width:160px;
 border-radius:12px;
 border:3px solid #fff;
}
.title{
 font-size:26px;
 font-weight:bold;
}

/* PLAYER */
.player{
 position:relative;
 margin-top:20px;
 padding-top:56.25%; /* 16:9 */
 border-radius:16px;
 overflow:hidden;
 background:#000;
}
.player iframe{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 border:none;
}

@media(max-width:600px){
 .banner{height:50vh}
 .poster img{width:120px}
 .title{font-size:20px}
}
</style>
</head>

<body>

<div class="wrapper">

<div class="banner" id="banner">
 <div class="banner-content">
  <div class="poster">
   <img id="poster">
  </div>
  <div class="title" id="title"></div>
 </div>
</div>

<div class="player">
 <iframe id="player" allowfullscreen></iframe>
</div>

</div>

<script>
const API="7bffed716d50c95ed1c4790cfab4866a";
const id=new URLSearchParams(location.search).get("id");

fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API}`)
.then(r=>r.json())
.then(m=>{
 banner.style.backgroundImage=
 `url(https://image.tmdb.org/t/p/original${m.backdrop_path})`;
 poster.src=
 `https://image.tmdb.org/t/p/w500${m.poster_path}`;
 title.innerText=
 m.title+" ("+m.release_date.slice(0,4)+")";
 player.src=
 `https://vidsrc.vip/embed/movie/${id}`;
});
</script>

</body>
</html>
