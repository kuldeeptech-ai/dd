<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Movie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--accent:#01b4e4}
body{margin:0;background:#050505;color:#fff;font-family:Arial}
.wrapper{max-width:1100px;margin:auto;padding:15px}

/* BANNER */
.banner{
 position:relative;
 height:clamp(280px,55vw,420px);
 background-size:cover;
 background-position:center;
 border-radius:18px;
 overflow:hidden;
}
.banner::before{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(
  to right,
  rgba(0,0,0,.88),
  rgba(0,0,0,.35)
 );
}
.banner-content{
 position:relative;
 display:flex;
 gap:20px;
 align-items:flex-end;
 padding:20px;
 height:100%;
}
.poster img{
 width:clamp(120px,25vw,180px);
 border-radius:14px;
 border:3px solid #fff;
}
.info{
 padding-bottom:6px;
}
.title{
 font-size:clamp(18px,4vw,28px);
 font-weight:bold;
}
.meta{
 font-size:14px;
 opacity:.85;
 margin-top:6px;
}

/* PLAYER */
.player{
 position:relative;
 margin-top:22px;
 padding-top:56.25%;
 border-radius:18px;
 overflow:hidden;
 background:#000;
}
.player iframe{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 border:none;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="banner" id="banner">
 <div class="banner-content">
  <div class="poster">
   <img id="poster">
  </div>
  <div class="info">
   <div class="title" id="title"></div>
   <div class="meta" id="meta"></div>
  </div>
 </div>
</div>

<div class="player">
 <iframe id="player" allowfullscreen></iframe>
</div>

</div>

<script>
const API="7bffed716d50c95ed1c4790cfab4866a";
const id=new URLSearchParams(location.search).get("id");

fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API}`)
.then(r=>r.json())
.then(m=>{
 banner.style.backgroundImage=
 `url(https://image.tmdb.org/t/p/original${m.backdrop_path})`;
 poster.src=
 `https://image.tmdb.org/t/p/w500${m.poster_path}`;
 title.innerText=
 m.title+" ("+m.release_date.slice(0,4)+")";
 meta.innerText=
 "⭐ "+m.vote_average+" • "+m.runtime+"m";
 player.src=
 `https://vidsrc.vip/embed/movie/${id}`;
});
</script>

</body>
</html>
