<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Movie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#01b4e4}
body{margin:0;background:#050505;color:#fff;font-family:Poppins,Arial}
.wrapper{max-width:1000px;margin:auto;padding:20px}
.banner{position:relative;height:60vh;background-size:cover;border-radius:16px;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.85),rgba(0,0,0,.35))}
.banner-content{position:relative;display:flex;gap:16px;align-items:flex-end;padding:20px;height:100%}
.poster img{width:160px;border-radius:12px;border:3px solid #fff}
.movie-name{font-size:26px;font-weight:bold}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;margin-top:20px}
.cast img{width:70px;height:70px;border-radius:50%}
iframe{width:100%;height:420px;border:none;border-radius:16px;margin-top:20px}
</style>
</head>
<body>
<div class="wrapper">
<div class="banner" id="banner">
<div class="banner-content">
<div class="poster"><img id="poster"></div>
<div>
<div class="movie-name" id="title"></div>
<div id="meta"></div>
</div>
</div>
</div>
<h3>Casts</h3>
<div class="cast" id="cast"></div>
<iframe id="watch" allowfullscreen></iframe>
</div>
<script src="app.js"></script>
</body>
</html>
