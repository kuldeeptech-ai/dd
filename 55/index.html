<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Indian Movies</title>

<style>
body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial;
}
.wrap{
 max-width:1100px;
 margin:auto;
 padding:15px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:12px;
}
.grid img{
 width:100%;
 border-radius:12px;
 cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">
<h2>Bharatiya Filmein</h2>
<div class="grid" id="movies"></div>
</div>

<script>
const API = "7bffed716d50c95ed1c4790cfab4866a";

// sirf India ki filmein
fetch(
 "https://api.themoviedb.org/3/discover/movie?api_key="+API+
 "&with_original_language=hi&region=IN&sort_by=popularity.desc"
)
.then(r=>r.json())
.then(d=>{
 d.results.forEach(m=>{
  if(!m.poster_path) return;
  movies.innerHTML += `
   <img src="https://image.tmdb.org/t/p/w300${m.poster_path}"
   onclick="openMovie(${m.id})">`;
 });
});

function openMovie(id){
 location.href = "movie.html?id="+id;
}
</script>

</body>
</html>
