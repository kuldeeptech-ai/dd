<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieHub</title>

<style>
body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial}
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 background:#111;
 position:sticky;
 top:0;
 z-index:10;
}
.logo{font-size:22px;color:#ff2f2f;font-weight:bold}
.search{position:relative;width:60%}
.search input{
 width:100%;
 padding:10px;
 border-radius:6px;
 border:none;
}
.suggest{
 position:absolute;
 background:#111;
 width:100%;
 z-index:20;
}
.item{
 display:flex;
 gap:10px;
 padding:8px;
 cursor:pointer;
}
.item img{width:45px;border-radius:6px}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
 gap:12px;
 padding:15px;
}
.grid img{width:100%;border-radius:8px;cursor:pointer}
</style>
</head>

<body onclick="hideSuggest()">

<header>
 <div class="logo">🎬 MovieHub</div>
 <div class="search" onclick="event.stopPropagation()">
  <input placeholder="Search movies & webseries..." onkeyup="search(this.value)">
  <div id="suggest" class="suggest"></div>
 </div>
</header>

<div id="grid" class="grid"></div>

<script>
const API_KEY="7bffed716d50c95ed1c4790cfab4866a";
let pageMovie=1;
let pageTV=1;
let loaded=new Set();

/* LOAD INDIAN MOVIES + TV */
async function loadContent(){
 const movieURL=
 `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_original_language=hi&region=IN&page=${pageMovie}`;
 const tvURL=
 `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_original_language=hi&region=IN&page=${pageTV}`;

 const [mRes,tRes]=await Promise.all([fetch(movieURL),fetch(tvURL)]);
 const mData=await mRes.json();
 const tData=await tRes.json();

 mData.results.forEach(x=>addItem(x,"movie"));
 tData.results.forEach(x=>addItem(x,"tv"));

 pageMovie++;
 pageTV++;
}

function addItem(x,type){
 if(!x.poster_path) return;
 const key=type+"-"+x.id;
 if(loaded.has(key)) return;
 loaded.add(key);

 grid.innerHTML+=`
 <img src="https://image.tmdb.org/t/p/w342${x.poster_path}"
 onclick="openPlayer('${type}',${x.id})">`;
}

async function search(q){
 if(q.length<2){suggest.innerHTML="";return;}
 const r=await fetch(
 `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${q}`
 );
 const d=await r.json();
 suggest.innerHTML="";
 d.results.forEach(x=>{
  if(!x.poster_path || !["movie","tv"].includes(x.media_type)) return;
  suggest.innerHTML+=`
  <div class="item" onclick="openPlayer('${x.media_type}',${x.id})">
   <img src="https://image.tmdb.org/t/p/w92${x.poster_path}">
   ${x.title||x.name}
  </div>`;
 });
}

function openPlayer(type,id){
 window.location.href=`player.html?type=${type}&id=${id}`;
}

function hideSuggest(){suggest.innerHTML=""}

/* INFINITE SCROLL */
window.addEventListener("scroll",()=>{
 if(window.innerHeight+window.scrollY>=document.body.offsetHeight-200){
  loadContent();
 }
});

loadContent();
</script>

</body>
</html>
