<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Text to Audio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>Text to Audio</h1>
  <p class="sub">Likhiye aur awaaz me suniye</p>

  <textarea id="text" placeholder="Yahan Hindi ya English text likhiye..."></textarea>

  <select id="voiceSelect"></select>

  <div class="controls">
    <button onclick="speakText()">Play</button>
    <button class="stop" onclick="stopSpeech()">Stop</button>
  </div>

  <p class="info">
    Website abhi development phase me hai<br>
    Jald hi launch hone wali hai
  </p>
</div>

<script src="script.js"></script>
</body>
</html>
